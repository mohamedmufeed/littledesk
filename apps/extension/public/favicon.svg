<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Comic Drop Shadow -->
  <circle cx="34" cy="34" r="28" fill="#0F172A" />
  
  <!-- Vibrant Comic Badge Background -->
  <circle cx="31" cy="31" r="28" fill="#FDE047" stroke="#0F172A" stroke-width="3" />
  
  <!-- Left Horn (Curving out and back) -->
  <path d="M 23 23 C 18 13 8 11 6 18 C 5 23 14 26 21 28 Z" 
        fill="#F59E0B" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Left Horn Ridges -->
  <path d="M 12 17 Q 15 20 18 25" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 9 20 Q 12 23 15 27" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" />

  <!-- Right Horn (Curving out and back) -->
  <path d="M 39 23 C 44 13 54 11 56 18 C 57 23 48 26 41 28 Z" 
        fill="#F59E0B" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Right Horn Ridges -->
  <path d="M 50 17 Q 47 20 44 25" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 53 20 Q 50 23 47 27" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" />

  <!-- Left Ear -->
  <path d="M 19 28 C 9 29 7 35 11 38 C 15 40 18 35 20 31 Z" 
        fill="#FDA4AF" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Right Ear -->
  <path d="M 43 28 C 53 29 55 35 51 38 C 47 40 44 35 42 31 Z" 
        fill="#FDA4AF" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Goat Beard (Goatee) -->
  <path d="M 26 47 L 31 58 L 36 47 Z" 
        fill="#FEF3C7" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />
  <line x1="31" y1="49" x2="31" y2="55" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" />

  <!-- Goat Head Base -->
  <path d="M 22 22 Q 31 20 40 22 C 43 29 42 41 38 48 C 34 50 28 50 24 48 C 20 41 19 29 22 22 Z" 
        fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Forehead Hair Tuft -->
  <path d="M 26 21 L 28 17 L 31 21 L 34 17 L 36 21 Z" 
        fill="#FEF08A" stroke="#0F172A" stroke-width="2" stroke-linejoin="round" />

  <!-- Goat Muzzle / Snout -->
  <ellipse cx="31" cy="44" rx="7.5" ry="4.5" 
           fill="#FED7AA" stroke="#0F172A" stroke-width="2" />
  <!-- Nostrils -->
  <circle cx="28.5" cy="43.5" r="1.2" fill="#0F172A" />
  <circle cx="33.5" cy="43.5" r="1.2" fill="#0F172A" />
  <path d="M 31 44.5 L 31 46.5" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round" />

  <!-- Eyes & Eyebrows (Determined G.O.A.T. Look) -->
  <!-- Left Eyebrow -->
  <line x1="22" y1="28" x2="28" y2="30" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
  <!-- Left Eye -->
  <ellipse cx="25.5" cy="33.5" rx="3.5" ry="3" fill="#0F172A" />
  <ellipse cx="25.5" cy="33.5" rx="2.5" ry="1.2" fill="#FACC15" />
  <circle cx="24.5" cy="32.5" r="1" fill="#FFFFFF" />

  <!-- Right Eyebrow -->
  <line x1="40" y1="28" x2="34" y2="30" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
  <!-- Right Eye -->
  <ellipse cx="36.5" cy="33.5" rx="3.5" ry="3" fill="#0F172A" />
  <ellipse cx="36.5" cy="33.5" rx="2.5" ry="1.2" fill="#FACC15" />
  <circle cx="35.5" cy="32.5" r="1" fill="#FFFFFF" />

  <!-- Comic Cheeks Accent -->
  <circle cx="21.5" cy="39" r="1.8" fill="#FB7185" opacity="0.8" />
  <circle cx="40.5" cy="39" r="1.8" fill="#FB7185" opacity="0.8" />
</svg>
